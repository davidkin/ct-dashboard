# /etc/nginx/sites-available/couture
# Активация: ln -s /etc/nginx/sites-available/couture /etc/nginx/sites-enabled/
# Затем: nginx -t && systemctl reload nginx  →  и после certbot --nginx -d <домен>
#
# Замени your-domain.com и путь к frontend/dist.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Статика frontend (vite build)
    root /home/deploy/couture-dashboard/frontend/dist;
    index index.html;

    # SPA-роутинг: любой путь → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (Fastify слушает 127.0.0.1:3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # OM-пуллы иногда небыстрые
    }

    client_max_body_size 5m;

    # certbot --nginx автоматически добавит сюда listen 443 ssl + редирект с 80.
}
