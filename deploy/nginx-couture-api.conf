# couture-traffic-check — фронт (React-дашборд) + публичный API за одним хостом.
# Активация:
#   sudo cp deploy/nginx-couture-api.conf /etc/nginx/sites-available/couture-api
#   sudo htpasswd ... (см. deploy-блок) → /etc/nginx/.htpasswd-couture
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 187-77-110-46.sslip.io   # переставит 443 ssl + редирект
#
# Фронт (статика dist) — ЗА ПАРОЛЕМ (в JS-бандл вшит EXPORT_TOKEN, без пароля любой прочитает данные).
# API /couture-traffic-check/api/ — публичный, авторизация своим токеном (?key=), фронт его и дёргает.

server {
    listen 80;
    listen [::]:80;
    server_name 187-77-110-46.sslip.io;

    root /home/openclaw/ct-dashboard/frontend/dist;
    index index.html;

    # Фронт под Basic-auth (пароль защищает бандл с токеном)
    location / {
        auth_basic "Couture Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd-couture;
        try_files $uri $uri/ /index.html;
    }

    # Публичный API (токен в ?key=), БЕЗ пароля — фронт фетчит его сам
    location /couture-traffic-check/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    client_max_body_size 5m;

    # certbot --nginx добавит сюда listen 443 ssl + редирект с 80.
}
